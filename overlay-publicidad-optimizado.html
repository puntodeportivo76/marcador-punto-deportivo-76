<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBC17Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",
  authDomain: "puntodeportivo-76.firebaseapp.com",
  databaseURL: "https://puntodeportivo-76-default-rtdb.firebaseio.com",
  projectId: "puntodeportivo-76",
  storageBucket: "puntodeportivo-76.firebasestorage.app",
  messagingSenderId: "881911537312",
  appId: "1:881911537312:web:9a5fb8f21ca43887c2f3c5"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const stage = document.getElementById("stage");
const $ = id => document.getElementById(id);
let timer = null, items = [], index = 0, duration = 0;
let active = false, currentLogo = "", logoImg = null;
function setText(id, value) {
  const el = $(id); value = String(value);
  if (el.textContent !== value) el.textContent = value;
}
function draw(item) {
  setText("name", item.name || "AUSPICIADOR");
  setText("desc", item.desc || "");
  const source = item.logo || "";
  if (source !== currentLogo) {
    currentLogo = source;
    if (logoImg) logoImg.remove();
    logoImg = null;
    if (source) {
      const img = document.createElement("img");
      logoImg = img;
      img.alt = "Logo " + (item.name || "auspiciador");
      img.onerror = () => { img.remove(); if (logoImg === img) { logoImg = null; currentLogo = ""; } };
      $("logoBox").appendChild(img);
      img.src = source;
    }
  }
  if (logoImg) logoImg.alt = "Logo " + (item.name || "auspiciador");
  stage.classList.add("show");
}
function stop() {
  if (timer !== null) clearInterval(timer);
  timer = null; active = false; items = []; index = 0; duration = 0;
  stage.classList.remove("show");
}
function cycle(data) {
  if (!data || data.enabled !== true) { stop(); return; }
  const next = (Array.isArray(data.items) ? data.items : []).filter(item => item && item.name);
  if (!next.length) { stop(); return; }
  const seconds = Math.max(5, Math.min(60, Number(data.seconds) || 10));
  if (active && duration === seconds && next.length === items.length && next.every((item,i) => ['name','desc','logo'].every(k => (item[k] || '') === (items[i][k] || '')))) return;
  if (timer !== null) clearInterval(timer);
  timer = null; items = next; index = 0; duration = seconds; active = true;
  draw(items[0]);
  if (items.length > 1) timer = setInterval(() => {
    if (!active) return;
    index = (index + 1) % items.length; draw(items[index]);
  }, seconds * 1000);
}
async function startOverlay() {
  try {
    await signInAnonymously(auth);
    onValue(ref(db, "sponsorOverlay"), snapshot => cycle(snapshot.val()), error => { stop(); console.error("Error leyendo sponsorOverlay:", error); });
  } catch (error) { stop(); console.error("No se pudo conectar a Firebase:", error); }
}
// Prueba local sin escritura ni lectura en Firebase: ?demo=1
if (new URLSearchParams(location.search).get('demo') === '1') {
  cycle({enabled:true,seconds:5,items:[
    {name:'AUSPICIADOR DE PRUEBA 1',desc:'Publicidad Punto Deportivo 76 · demostración',logo:''},
    {name:'AUSPICIADOR DE PRUEBA 2',desc:'Rotación automática cada 5 segundos',logo:''}
  ]});
} else {
  startOverlay();
}
</script>
