<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay equipos · Punto Deportivo 76</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#stage{position:absolute;inset:0;display:none;color:#fff}
#stage.show{display:block}
.backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,rgba(255,94,0,.27),transparent 42%),linear-gradient(115deg,rgba(2,8,18,.94),rgba(5,12,25,.84) 50%,rgba(1,7,16,.94));border-top:3px solid #ff6500;border-bottom:3px solid #ff6500}
.stripe{position:absolute;top:-10%;height:120%;width:5%;background:#ff5b00;transform:skew(-27deg);opacity:.95}.s1{left:1%}.s2{right:2%;width:2%;background:#fff}.dots{position:absolute;right:4%;top:8%;width:15%;height:20%;opacity:.28;background-image:radial-gradient(#ff6500 2px,transparent 2px);background-size:15px 15px}
.brand{position:absolute;top:4%;left:50%;transform:translateX(-50%);font-weight:1000;font-style:italic;text-align:center;letter-spacing:1px;text-shadow:0 3px 0 #07101b;font-size:clamp(15px,2.15vw,32px);white-space:nowrap;display:flex;align-items:center;gap:.28em}.brand span{color:#ff6500}.brandMark{display:inline-flex;align-items:center;justify-content:center;width:1.75em;height:1.75em;border-radius:50%;border:2px solid #ff6500;background:radial-gradient(circle,#fff 0%,#dfe4eb 55%,#101b2a 58%);color:#0c2946!important;font-style:italic;font-size:.75em;box-shadow:0 0 12px #ff6500aa;text-shadow:none}.tag{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:clamp(11px,1.2vw,18px);letter-spacing:.35em;font-weight:900;color:#fff;background:#111923;border-top:2px solid #ff6500;border-bottom:2px solid #ff6500;padding:.35em 1.5em;white-space:nowrap}
.match{position:absolute;left:5%;right:5%;top:27%;bottom:15%;display:grid;grid-template-columns:1fr .45fr 1fr;align-items:center;gap:1.2%}
.team{height:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;position:relative}
.logoFrame{width:min(29vh,23vw);height:min(29vh,23vw);max-width:330px;max-height:330px;min-width:100px;min-height:100px;border-radius:50%;padding:8px;background:linear-gradient(145deg,#fff,#ff6500 38%,#111923 62%,#fff);box-shadow:0 0 0 3px #ff6500,0 0 32px #ff650088;display:flex;align-items:center;justify-content:center}
.logoInner{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#fff,#d9dce2);border:4px solid #101722;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#142239;font-weight:900;font-size:clamp(14px,1.6vw,24px);text-align:center;padding:8px}
.logoInner img{width:100%;height:100%;object-fit:contain}
.teamName{max-width:100%;min-width:45%;text-align:center;text-transform:uppercase;font-weight:1000;font-style:italic;font-size:clamp(18px,3vw,48px);line-height:1.05;padding:.25em .8em;background:linear-gradient(90deg,#0a0d13,#252b35,#0a0d13);border:2px solid #ff6500;box-shadow:0 5px 0 #7c2b00;text-shadow:0 2px 2px #000;overflow-wrap:anywhere}
.vs{font-size:clamp(42px,8vw,120px);font-weight:1000;font-style:italic;line-height:1;color:#ff6500;-webkit-text-stroke:1px #fff;text-shadow:4px 5px 0 #111,0 0 28px #ff6500;text-align:center}
.footer{position:absolute;bottom:2.5%;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:.7em;flex-wrap:wrap;font-size:clamp(9px,1.15vw,17px);font-weight:900;letter-spacing:.12em;text-align:center;border:2px solid #ff6500;background:rgba(4,8,15,.94);padding:.5em 1.1em;max-width:94%;box-shadow:0 0 20px #ff650055}.matchMeta{color:#ff8b3d;border-right:1px solid #ff6500;padding-right:.7em;white-space:nowrap}.liveText{white-space:nowrap}
@media(max-aspect-ratio:1/1){.match{left:2%;right:2%;top:25%;bottom:16%;gap:0}.logoFrame{width:25vw;height:25vw;min-width:65px;min-height:65px}.teamName{font-size:clamp(12px,3vw,28px);padding:.3em .4em}.vs{font-size:clamp(32px,8vw,65px)}.brand{font-size:clamp(13px,3vw,24px)}.tag{letter-spacing:.15em}}
</style></head>
<body>
<div id="stage"><div class="backdrop"></div><div class="stripe s1"></div><div class="stripe s2"></div><div class="dots"></div>
<div class="brand"><span class="brandMark">P76</span> <span>PUNTO DEPORTIVO</span> STREAMING</div><div class="tag" id="event">PRESENTACIÓN DE EQUIPOS</div>
<div class="match">
 <div class="team"><div class="logoFrame"><div class="logoInner" id="homeLogo">ESCUDO<br>LOCAL</div></div><div class="teamName" id="homeName">EQUIPO LOCAL</div></div>
 <div class="vs">VS</div>
 <div class="team"><div class="logoFrame"><div class="logoInner" id="awayLogo">ESCUDO<br>VISITANTE</div></div><div class="teamName" id="awayName">EQUIPO VISITANTE</div></div>
</div><div class="footer"><span class="matchMeta" id="matchMeta">FEMENINA · U13</span><span class="liveText">PUNTO DEPORTIVO 76 · TRANSMISIÓN EN VIVO</span></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const config={apiKey:"AIzaSyBC17Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",authDomain:"puntodeportivo-76.firebaseapp.com",databaseURL:"https://puntodeportivo-76-default-rtdb.firebaseio.com",projectId:"puntodeportivo-76",storageBucket:"puntodeportivo-76.firebasestorage.app",messagingSenderId:"881911537312",appId:"1:881911537312:web:9a5fb8f21ca43887c2f3c5"};
const app=initializeApp(config,"p76-team-overlay"),db=getDatabase(app),auth=getAuth(app),stage=document.getElementById("stage");
function setLogo(id,data,label){const el=document.getElementById(id);el.replaceChildren();if(data){const img=document.createElement("img");img.src=data;img.alt="Escudo "+label;img.onerror=()=>{el.textContent="ESCUDO";};el.append(img)}else{el.textContent=label}}
function render(d){if(!d||d.visible!==true){stage.classList.remove("show");return}document.getElementById("homeName").textContent=d.homeName||"EQUIPO LOCAL";document.getElementById("awayName").textContent=d.awayName||"EQUIPO VISITANTE";document.getElementById("event").textContent=d.eventName||"PRESENTACIÓN DE EQUIPOS";document.getElementById("matchMeta").textContent=(d.category||"Femenina").toUpperCase()+" · "+(d.division||"U13");setLogo("homeLogo",d.homeLogo,"LOCAL");setLogo("awayLogo",d.awayLogo,"VISITANTE");stage.classList.add("show")}
(async()=>{try{await signInAnonymously(auth);onValue(ref(db,"teamIntroOverlay"),s=>render(s.val()),e=>{stage.classList.remove("show");console.error(e)})}catch(e){console.error("No se pudo conectar a Firebase",e)}})();
</script></body></html>
