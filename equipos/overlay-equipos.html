<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay equipos · Punto Deportivo 76</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#stage{position:absolute;inset:0;display:none;overflow:hidden;color:#fff}
#stage.show{display:block}
.background{position:absolute;inset:0;background-image:url("fondo-presentacion-equipos.png");background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.team-logo{position:absolute;top:50.2%;width:21.4vw;height:21.4vw;max-width:37vh;max-height:37vh;min-width:70px;min-height:70px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#fff 0%,#f1f4f8 72%,#d6dbe4 100%);border:clamp(3px,.5vw,8px) solid #f4f7fb;box-shadow:0 0 0 clamp(3px,.45vw,7px) #ff6900,0 0 0 clamp(6px,.8vw,12px) #111b2b,0 0 22px #ff6a00aa;padding:3%}
#homeLogo{left:23.5%}#awayLogo{left:75%}
.team-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.team-logo .placeholder{font-weight:1000;font-size:clamp(12px,2.2vw,32px);color:#142238;text-align:center}
.team-name{position:absolute;top:71.8%;transform:translate(-50%,-50%);width:27.2vw;height:9.2vh;min-height:44px;max-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 1.5%;overflow:hidden;background:linear-gradient(180deg,rgba(3,9,17,.99),rgba(5,12,22,.99));border:clamp(2px,.25vw,4px) solid #ff7200;box-shadow:0 4px 0 #a84400, inset 0 0 14px #15243b;text-transform:uppercase;font-weight:1000;font-style:italic;font-size:clamp(15px,3vw,48px);line-height:1.02;text-shadow:0 2px 2px #000;overflow-wrap:anywhere;word-break:normal}
#homeName{left:23.5%}#awayName{left:75%}
.meta-bar{position:absolute;left:50%;bottom:2.8%;transform:translateX(-50%);width:min(74vw,1240px);min-height:6.7%;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.2vw,20px);padding:.55em 1.5em;background:rgba(3,8,15,.97);border:2px solid #ff6900;box-shadow:0 0 18px #ff690055;text-align:center;font-size:clamp(9px,1.12vw,18px);font-weight:1000;letter-spacing:.11em;text-transform:uppercase}
.meta{color:#ff7a19;white-space:nowrap;border-right:3px solid #ff7200;padding-right:clamp(8px,1.2vw,20px)}
.live{white-space:nowrap}
@media(max-aspect-ratio:1/1){
 .background{background-size:auto 100%;background-position:center}
 .team-logo{width:25vw;height:25vw;min-width:56px;min-height:56px}
 #homeLogo{left:23%}#awayLogo{left:77%}
 .team-name{width:32vw;height:8vh;min-height:35px;font-size:clamp(11px,3.2vw,25px)}
 #homeName{left:23%}#awayName{left:77%}
 .meta-bar{width:94vw;bottom:2%;font-size:clamp(7px,1.9vw,12px);gap:6px;padding:.45em .5em;letter-spacing:.04em}
 .meta{padding-right:6px;border-right-width:2px}
}
</style>
</head>
<body>
<div id="stage">
  <div class="background"></div>
  <div class="team-logo" id="homeLogo"><span class="placeholder">LOCAL</span></div>
  <div class="team-logo" id="awayLogo"><span class="placeholder">VISITANTE</span></div>
  <div class="team-name" id="homeName">EQUIPO LOCAL</div>
  <div class="team-name" id="awayName">EQUIPO VISITANTE</div>
  <div class="meta-bar"><span class="meta" id="matchMeta">FEMENINA · U13</span><span class="live">PUNTO DEPORTIVO 76 · TRANSMISIÓN EN DIRECTO</span></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const config={apiKey:"AIzaSyBC17Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",authDomain:"puntodeportivo-76.firebaseapp.com",databaseURL:"https://puntodeportivo-76-default-rtdb.firebaseio.com",projectId:"puntodeportivo-76",storageBucket:"puntodeportivo-76.firebasestorage.app",messagingSenderId:"881911537312",appId:"1:881911537312:web:9a5fb8f21ca43887c2f3c5"};
const app=initializeApp(config,"p76-team-overlay"),db=getDatabase(app),auth=getAuth(app),stage=document.getElementById("stage");
function setLogo(id,data,label){const el=document.getElementById(id);el.replaceChildren();if(data){const img=document.createElement("img");img.src=data;img.alt="Escudo "+label;img.onerror=()=>{el.textContent="ESCUDO";};el.append(img)}else{el.textContent=label}}
function render(d){if(!d||d.visible!==true){stage.classList.remove("show");return}document.getElementById("homeName").textContent=d.homeName||"EQUIPO LOCAL";document.getElementById("awayName").textContent=d.awayName||"EQUIPO VISITANTE";document.getElementById("event").textContent=d.eventName||"PRESENTACIÓN DE EQUIPOS";document.getElementById("matchMeta").textContent=(d.category||"Femenina").toUpperCase()+" · "+(d.division||"U13");setLogo("homeLogo",d.homeLogo,"LOCAL");setLogo("awayLogo",d.awayLogo,"VISITANTE");stage.classList.add("show")}
(async()=>{try{await signInAnonymously(auth);onValue(ref(db,"teamIntroOverlay"),s=>render(s.val()),e=>{stage.classList.remove("show");console.error(e)})}catch(e){console.error("No se pudo conectar a Firebase",e)}})();
</script>
</body>
</html>
