<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final del partido | Punto Deportivo 76</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif}
main{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:clamp(4px,3vmin,32px);isolation:isolate;overflow:hidden;text-align:center;background:linear-gradient(135deg,#ff6500 0 4%,transparent 4.1% 96%,#ff6500 96.1%),radial-gradient(ellipse at 14% 4%,#5481a8 0,transparent 23%),radial-gradient(ellipse at 86% 4%,#5481a8 0,transparent 23%),linear-gradient(#080e18,#071727 70%,#131d29)}
main::before{content:"";position:absolute;z-index:-1;left:-15%;right:-15%;bottom:-27%;height:58%;opacity:.52;transform:perspective(280px) rotateX(48deg);transform-origin:bottom;background:radial-gradient(ellipse at center,transparent 0 17%,#7c8c9d 17.3% 17.9%,transparent 18.2%),linear-gradient(90deg,transparent 49.8%,#7c8c9d 49.9% 50.1%,transparent 50.2%),repeating-linear-gradient(90deg,#1c2936 0 2px,#121b26 3px 5vw)}
.brand{font-size:clamp(10px,5vmin,55px);font-weight:950;font-style:italic;line-height:.93;text-transform:uppercase;text-shadow:0 4px 18px #000}
.brand b,.dash{color:#ff6500}
.panel{--cut:clamp(8px,4vmin,44px);position:relative;width:min(94vw,168vh);padding:clamp(8px,2vmin,24px) 4%;background:#ff6500;clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));isolation:isolate}
.panel::before{content:"";position:absolute;inset:2px;z-index:-1;clip-path:inherit;background:linear-gradient(155deg,#10283f,#04111f 65%)}
header{font-size:clamp(10px,5.6vmin,62px);font-weight:950;font-style:italic;letter-spacing:.025em}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:2vmin;align-items:start;padding:2vmin 0}
.team{display:grid;justify-items:center;gap:1vmin;min-width:0}
.crest{width:clamp(20px,17vmin,168px);aspect-ratio:1;display:grid;place-items:center;background:#102741;border:2px solid #ff6500;border-radius:14%;font-size:clamp(10px,7vmin,74px);font-weight:900;font-style:italic;overflow:hidden}
.crest>*{grid-area:1/1}
img{width:100%;height:100%;object-fit:contain;padding:7%;background:#102741}
.name{font-size:clamp(8px,3vmin,34px);font-weight:900;overflow-wrap:anywhere;max-width:100%}
.score{align-self:center;font-size:clamp(18px,min(15vw,17vh),190px);font-weight:950;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
footer{border-top:1px solid #ff6500;padding-top:1vmin;font-size:clamp(7px,2.4vmin,26px);font-weight:900;letter-spacing:.08em}
</style>
<main hidden>
<div class="brand">Punto<br>Deportivo <b>76</b></div>
<section class="panel">
<header>FINAL DEL PARTIDO</header>
<div class="result">
<div class="team"><div class="crest"><span id="homeInitial"></span><img id="homeLogo" alt="" hidden></div><div class="name" id="homeName"></div></div>
<div class="score"><span id="homeScore"></span><span class="dash"> – </span><span id="awayScore"></span></div>
<div class="team"><div class="crest"><span id="awayInitial"></span><img id="awayLogo" alt="" hidden></div><div class="name" id="awayName"></div></div>
</div>
<footer>PUNTO DEPORTIVO 76 · BÁSQUETBOL</footer>
</section>
</main>
<script type="module">
const byId = id => document.getElementById(id);
for (const side of ["home", "away"]) {
  const image = byId(side + "Logo");
  image.onload = () => { image.hidden = false; };
  image.onerror = () => { image.hidden = true; };
}
function render(game) {
  if (!game) {
    document.querySelector("main").hidden = true;
    return;
  }
  for (const [side, fallback] of [["home", "Local"], ["away", "Visita"]]) {
    const name = String(game[side + "Name"] || "").trim() || fallback;
    byId(side + "Name").textContent = name;
    byId(side + "Initial").textContent = name.slice(0, 2).toUpperCase();
    byId(side + "Score").textContent = Math.max(0, Number(game[side + "Score"]) || 0);
    const image = byId(side + "Logo");
    const logo = typeof game[side + "Logo"] === "string" ? game[side + "Logo"].trim() : "";
    if (logo !== (image.getAttribute("src") || "")) {
      image.hidden = true;
      if (logo) image.src = logo;
      else image.removeAttribute("src");
    }
  }
  document.querySelector("main").hidden = false;
}

if (new URLSearchParams(location.search).get("demo") === "1") {
  render({homeName:"RDS", awayName:"Visita", homeScore:68, awayScore:54});
} else {
  const sdk = "https://www.gstatic.com/firebasejs/12.19.0/";
  try {
    const [{initializeApp}, {getDatabase, ref, onValue}] = await Promise.all([
      import(sdk + "firebase-app.js"),
      import(sdk + "firebase-database.js")
    ]);
    const app = initializeApp({databaseURL:"https://puntodeportivo-76-default-rtdb.firebaseio.com"});
    onValue(ref(getDatabase(app), "marcador/finalOverlay"), snapshot => {
      const result = snapshot.val();
      render(result?.visible === true ? result : null);
    }, error => {
      render(null);
      console.error("No se pudo leer el marcador.", error);
    });
  } catch (error) {
    console.error("No se pudo conectar al marcador.", error);
  }
}
</script>
</html>
