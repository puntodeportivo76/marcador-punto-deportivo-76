<title>Punto Deportivo 76 - Marcador</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:1%}
.board{position:relative;width:98%;max-width:1400px;overflow:hidden;border:3px solid #ff6500;border-radius:18px;background:
radial-gradient(circle at 50% 52%,rgba(0,62,110,.55),transparent 36%),
radial-gradient(circle at 50% 50%,rgba(255,101,0,.12),transparent 50%),
repeating-radial-gradient(circle at 50% 50%,#151a1f 0,#151a1f 3px,#0b0f13 4px,#0b0f13 7px);
box-shadow:0 5px 22px rgba(0,0,0,.5);color:white}
.watermark{position:absolute;z-index:0;left:50%;top:56%;transform:translate(-50%,-50%);width:42%;opacity:.24;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,101,0,.18))}
.watermark img{width:100%;display:block}
.board>*:not(.watermark){position:relative;z-index:1}
.top{background:#ff6500;color:#050505;font-weight:900;text-align:center;font-size:clamp(14px,2.4vw,31px);padding:9px 12px;letter-spacing:1px}
.main{display:grid;grid-template-columns:1fr 180px 1fr;gap:22px;align-items:start;padding:22px 28px 14px}
.team{text-align:center}
.teamname{background:#031221;border-left:8px solid #ff6500;border-radius:4px;padding:10px 8px;font-size:clamp(20px,3.1vw,48px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:clamp(64px,9vw,130px);line-height:.95;font-weight:900;color:#ff6500;text-shadow:0 0 18px rgba(255,101,0,.4);margin-top:18px}
.center{text-align:center}.period{font-size:clamp(18px,2.2vw,30px);font-weight:900;margin-bottom:8px}
.clock{display:inline-block;background:#050505;border:5px solid #ff6500;border-radius:12px;padding:5px 13px;font-size:clamp(30px,4.5vw,60px);font-weight:900;white-space:nowrap}
.bottom{border-top:3px solid #ff6500;display:grid;grid-template-columns:1fr 4px 1fr;align-items:center;text-align:center;padding:10px 22px;font-size:clamp(14px,2.1vw,30px);font-weight:900}
.sep{height:50px;background:#ff6500}
.controls{background:#071522;padding:14px;display:grid;gap:9px}
.controls .line{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
button,input{font:inherit}button{min-height:42px;border:2px solid #ff6500;border-radius:9px;background:#050505;color:#fff;padding:8px 12px;font-weight:800}
input{min-height:42px;width:150px;border:1px solid #ff6500;border-radius:8px;background:#101820;color:#fff;text-align:center;padding:7px}
.small{text-align:center;color:#cfd5da;font-size:12px}.status{text-align:center;color:#cfd5da;font-size:12px}
@media(max-width:650px){.main{grid-template-columns:1fr 100px 1fr;gap:7px;padding:12px 8px 8px}.watermark{width:58%}.teamname{font-size:clamp(12px,4vw,25px);border-left-width:4px}.score{font-size:clamp(44px,13vw,80px)}.clock{border-width:3px;padding:4px 7px}.bottom{padding:7px 4px}}
</style>
</head>

<div class="top">● EN VIVO · PUNTO DEPORTIVO 76 · BÁSQUETBOL</div>
<div class="main">
<div class="team"><div class="teamname" id="homeName">LOCAL</div><div class="score" id="homeScore">0</div></div>
<div class="center"><div class="period" id="period">Q1</div><div class="clock" id="clock">10:00</div></div>
<div class="team"><div class="teamname" id="awayName">VISITA</div><div class="score" id="awayScore">0</div></div>
</div>
<div class="bottom"><div>FALTAS LOCAL: <span id="homeFouls">0</span></div><div class="sep"></div><div>FALTAS VISITA: <span id="awayFouls">0</span></div></div>
<div class="controls" id="controls">
<div class="line"><input id="homeInput" value="LOCAL"><input id="awayInput" value="VISITA"><button id="namesBtn">Nombres</button></div>
<div class="line"><input id="clockInput" value="10:00" inputmode="numeric"><button id="setClock">Aplicar tiempo</button></div>
<div class="line"><button data-team="h" data-p="1">Local +1</button><button data-team="h" data-p="2">Local +2</button><button data-team="h" data-p="3">Local +3</button><button data-team="a" data-p="1">Visita +1</button><button data-team="a" data-p="2">Visita +2</button><button data-team="a" data-p="3">Visita +3</button></div>
<div class="line"><button id="hf">Local falta +</button><button id="af">Visita falta +</button><button id="periodBtn">Cambiar período</button><button id="startBtn">▶ Reloj</button><button id="resetClock">Reiniciar reloj</button><button id="resetAll">Reiniciar partido</button></div>
<div class="status" id="status">Conectando con Firebase…</div><div class="small">Control remoto Punto Deportivo 76</div>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyBC17Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",authDomain:"puntodeportivo-76.firebaseapp.com",databaseURL:"https://puntodeportivo-76-default-rtdb.firebaseio.com",projectId:"puntodeportivo-76",storageBucket:"puntodeportivo-76.firebasestorage.app",messagingSenderId:"881911537312",appId:"1:881911537312:web:9a5fb8f21ca43887c2f3c5"});
const db=getDatabase(app),gameRef=ref(db,"marcador"),control=new URLSearchParams(location.search).get("control")==="1";
document.getElementById("controls").style.display=control?"grid":"none";
let state={homeName:"LOCAL",awayName:"VISITA",homeScore:0,awayScore:0,homeFouls:0,awayFouls:0,q:1,clockSeconds:600,clockRunning:false,clockEndAt:null};
let editH=false,editA=false,editC=false;
const sec=()=>state.clockRunning&&state.clockEndAt?Math.max(0,Math.ceil((state.clockEndAt-Date.now())/1000)):Math.max(0,Number(state.clockSeconds)||0);
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function draw(){homeName.textContent=state.homeName||"LOCAL";awayName.textContent=state.awayName||"VISITA";homeScore.textContent=state.homeScore||0;awayScore.textContent=state.awayScore||0;homeFouls.textContent=state.homeFouls||0;awayFouls.textContent=state.awayFouls||0;period.textContent="Q"+(state.q||1);clock.textContent=fmt(sec());if(control){if(!editH)homeInput.value=state.homeName||"LOCAL";if(!editA)awayInput.value=state.awayName||"VISITA";if(!editC)clockInput.value=fmt(sec());startBtn.textContent=state.clockRunning?"⏸ Pausa":"▶ Reloj"}}
function save(s){state=s;draw();return set(gameRef,state)}
onValue(gameRef,s=>{if(s.exists())state={...state,...s.val()};else if(control)set(gameRef,state);draw();status.textContent="● Marcador conectado"},()=>status.textContent="Error de conexión con Firebase");
if(control){
homeInput.onfocus=()=>editH=true;homeInput.oninput=()=>editH=true;awayInput.onfocus=()=>editA=true;awayInput.oninput=()=>editA=true;clockInput.onfocus=()=>editC=true;clockInput.oninput=()=>editC=true;
document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>save({...state,[b.dataset.team==="h"?"homeScore":"awayScore"]:state[b.dataset.team==="h"?"homeScore":"awayScore"]+Number(b.dataset.p)}));
namesBtn.onclick=()=>{editH=editA=false;save({...state,homeName:homeInput.value.trim()||"LOCAL",awayName:awayInput.value.trim()||"VISITA"})};
setClock.onclick=()=>{let m=clockInput.value.match(/^(\d{1,3}):([0-5]\d)$/);if(!m){status.textContent="Usa MM:SS";return}editC=false;save({...state,clockSeconds:Number(m[1])*60+Number(m[2]),clockRunning:false,clockEndAt:null})};
hf.onclick=()=>save({...state,homeFouls:Math.min(9,state.homeFouls+1)});af.onclick=()=>save({...state,awayFouls:Math.min(9,state.awayFouls+1)});
periodBtn.onclick=()=>save({...state,q:state.q<4?state.q+1:1});
startBtn.onclick=()=>{if(state.clockRunning)save({...state,clockRunning:false,clockSeconds:sec(),clockEndAt:null});else if(sec()>0)save({...state,clockRunning:true,clockEndAt:Date.now()+sec()*1000})};
resetClock.onclick=()=>{editC=false;save({...state,clockSeconds:600,clockRunning:false,clockEndAt:null})};
resetAll.onclick=()=>{editH=editA=editC=false;save({homeName:"LOCAL",awayName:"VISITA",homeScore:0,awayScore:0,homeFouls:0,awayFouls:0,q:1,clockSeconds:600,clockRunning:false,clockEndAt:null})}
}
setInterval(()=>{draw();if(control&&state.clockRunning&&sec()===0)save({...state,clockRunning:false,clockSeconds:0,clockEndAt:null})},250);draw();
</script>
