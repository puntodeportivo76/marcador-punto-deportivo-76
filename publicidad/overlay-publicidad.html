<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punto Deportivo 76 · Publicidad</title>
<style>
:root {
  --orange:#ff6500;
  --navy:#06264b;
  --navy-deep:#03162d;
}
* { box-sizing:border-box; }
html, body {
  margin:0; width:100%; height:100%; background:transparent;
  overflow:hidden; font-family:Arial,Helvetica,sans-serif;
}
#stage {
  position:absolute; left:3%; right:3%; top:4%;
  height:clamp(70px,15vh,145px);
  display:flex; align-items:stretch; opacity:0;
  transform:translateY(-12px);
  transition:opacity .35s,transform .35s;
  pointer-events:none;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));
}
#stage.show { opacity:1; transform:translateY(0); }
.ad {
  position:relative; overflow:hidden; width:100%;
  display:flex; align-items:center;
  gap:clamp(12px,2vw,28px);
  padding:clamp(7px,1.2vh,14px) clamp(14px,2vw,28px);
  color:var(--navy);
  border:3px solid var(--orange);
  background:
    linear-gradient(125deg, transparent 0 78%, rgba(6,38,75,.07) 78% 81%, transparent 81% 84%, rgba(255,101,0,.12) 84% 87%, transparent 87%),
    repeating-linear-gradient(135deg, rgba(6,38,75,.018) 0 1px, transparent 1px 7px),
    linear-gradient(100deg,#fff 0%,#fff 75%,#f6f8fb 100%);
}
.ad:before {
  content:""; position:absolute; left:0; top:0; width:100%; height:4px;
  background:linear-gradient(90deg,var(--orange),#ffb15d 40%,var(--navy) 100%);
}
.logoBox {
  position:relative; z-index:1;
  height:100%; width:clamp(90px,17vw,230px); flex:0 0 clamp(90px,17vw,230px);
  display:flex; align-items:center; justify-content:center;
  border-right:2px solid rgba(255,101,0,.7);
  padding-right:clamp(8px,1.5vw,20px);
}
.logoBox img { display:block; max-width:100%; max-height:100%; object-fit:contain; }
.copy { min-width:0; flex:1; position:relative; z-index:1; display:flex; flex-direction:column; justify-content:center; }
.name {
  color:var(--navy); font-size:clamp(19px,3vw,42px); font-weight:900;
  line-height:1.05; text-transform:uppercase; overflow-wrap:anywhere;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.desc {
  font-size:clamp(12px,1.5vw,20px); margin-top:6px; color:#173858;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
@media(max-width:600px) {
  #stage { left:2%; right:2%; top:2%; height:clamp(65px,12vh,100px); }
  .ad { padding:6px 8px; gap:8px; }
  .logoBox { width:clamp(65px,19vw,110px); flex-basis:clamp(65px,19vw,110px); padding-right:7px; }
  .name { font-size:clamp(15px,3.5vw,22px); }
  .desc { font-size:clamp(10px,2.5vw,14px); margin-top:3px; }
}
</style>
</head>
<body>
<div id="stage" aria-live="polite">
  <div class="ad">
    <div class="logoBox" id="logoBox"></div>
    <div class="copy">
      <div class="name" id="name">NOMBRE DE MARCA</div>
      <div class="desc" id="desc">Descripción breve del auspiciador</div>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBC17Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",
  authDomain: "puntodeportivo-76.firebaseapp.com",
  databaseURL: "https://puntodeportivo-76-default-rtdb.firebaseio.com",
  projectId: "puntodeportivo-76",
  storageBucket: "puntodeportivo-76.firebasestorage.app",
  messagingSenderId: "881911537312",
  appId: "1:881911537312:web:9a5fb8f21ca43887c2f3c5"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const stage = document.getElementById("stage");
const $ = id => document.getElementById(id);
let timer = null, items = [], index = 0;

function draw(item) {
  $("name").textContent = item.name || "AUSPICIADOR";
  $("desc").textContent = item.desc || "";
  $("logoBox").replaceChildren();
  if (item.logo) {
    const img = document.createElement("img");
    img.src = item.logo;
    img.alt = "Logo " + (item.name || "auspiciador");
    img.onerror = () => img.remove();
    $("logoBox").appendChild(img);
  }
  stage.classList.add("show");
}
function cycle(data) {
  if (timer) { clearInterval(timer); timer = null; }
  stage.classList.remove("show");
  items = (data && Array.isArray(data.items) ? data.items : [])
    .filter(item => item && item.name);
  index = 0;
  if (!data || data.enabled !== true || !items.length) return;
  const seconds = Math.max(5, Math.min(60, Number(data.seconds) || 10));
  draw(items[0]);
  if (items.length > 1) {
    timer = setInterval(() => {
      index = (index + 1) % items.length;
      draw(items[index]);
    }, seconds * 1000);
  }
}
async function startOverlay() {
  try {
    await signInAnonymously(auth);
    onValue(ref(db, "sponsorOverlay"), snapshot => cycle(snapshot.val()), error => {
      stage.classList.remove("show");
      console.error("Error leyendo sponsorOverlay:", error);
    });
  } catch (error) {
    stage.classList.remove("show");
    console.error("No se pudo conectar a Firebase:", error);
  }
}
startOverlay();
</script>
</body>
</html>
