<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punto Deportivo 76 · Publicidad</title>
<style>
:root { --orange:#ff6500; --black:#080808; --white:#fff; }
* { box-sizing:border-box; }
html, body {
  margin:0; width:100%; height:100%; background:transparent;
  overflow:hidden; font-family:Arial,Helvetica,sans-serif;
}
/* Overlay superior independiente para Larix */
#stage {
  position:absolute; left:3%; right:3%; top:4%; bottom:auto;
  height:clamp(70px,15vh,145px);
  display:flex; align-items:stretch; opacity:0;
  transform:translateY(-12px);
  transition:opacity .35s,transform .35s;
  pointer-events:none;
}
#stage.show { opacity:1; transform:translateY(0); }
.brand {
  background:var(--black);
  border:3px solid var(--orange);
  border-right:0;
  display:flex; align-items:center; justify-content:center;
  padding:5px; width:24%; min-width:110px; max-width:24%;
  flex:0 0 24%; overflow:hidden;
}
.brand img {
  display:block; width:100%; height:100%;
  max-width:100%; max-height:100%; object-fit:contain;
}
.ad {
  flex:1; min-width:0; background:rgba(7,7,7,.96);
  border:3px solid var(--orange);
  display:flex; align-items:center; gap:clamp(10px,2vw,26px);
  padding:10px clamp(14px,2.6vw,34px); color:white;
  box-shadow:0 4px 18px #0008;
}
.logoBox {
  height:100%; width:clamp(60px,10vw,130px); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.logoBox img { max-width:100%; max-height:100%; object-fit:contain; }
.copy { min-width:0; flex:1; }
.kicker {
  color:var(--orange); font-size:clamp(10px,1.2vw,16px);
  font-weight:900; letter-spacing:.14em; text-transform:uppercase;
  margin-bottom:4px;
}
.name {
  font-size:clamp(18px,3vw,40px); font-weight:900; line-height:1.02;
  text-transform:uppercase; overflow-wrap:anywhere;
}
.desc {
  font-size:clamp(11px,1.4vw,19px); margin-top:5px; color:#eee;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tag {
  background:var(--orange); color:#111; font-weight:900;
  text-transform:uppercase; padding:10px 12px;
  font-size:clamp(10px,1.3vw,17px); align-self:center; white-space:nowrap;
}
@media(max-width:600px) {
  #stage { left:2%; right:2%; top:2%; height:clamp(65px,12vh,100px); }
  .brand { min-width:75px; padding:4px; }
  .ad { padding:7px; gap:8px; }
  .tag { display:none; }
  .desc { max-width:100%; }
}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBC17Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",
  authDomain: "puntodeportivo-76.firebaseapp.com",
  databaseURL: "https://puntodeportivo-76-default-rtdb.firebaseio.com",
  projectId: "puntodeportivo-76",
  storageBucket: "puntodeportivo-76.firebasestorage.app",
  messagingSenderId: "881911537312",
  appId: "1:881911537312:web:9a5fb8f21ca43887c2f3c5"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const stage = document.getElementById("stage");
const $ = id => document.getElementById(id);
let timer = null, items = [], index = 0;

function draw(item) {
  $("kicker").textContent = item.kicker || "AUSPICIADOR OFICIAL";
  $("name").textContent = item.name || "AUSPICIADOR";
  $("desc").textContent = item.desc || "";
  $("tag").textContent = item.tag || "APÓYANOS";
  $("logoBox").replaceChildren();
  if (item.logo) {
    const img = document.createElement("img");
    img.src = item.logo;
    img.alt = "Logo " + (item.name || "auspiciador");
    img.onerror = () => img.remove();
    $("logoBox").appendChild(img);
  }
  stage.classList.add("show");
}
function cycle(data) {
  if (timer) { clearInterval(timer); timer = null; }
  stage.classList.remove("show");
  items = (data && Array.isArray(data.items) ? data.items : [])
    .filter(item => item && item.name);
  index = 0;
  if (!data || data.enabled !== true || !items.length) return;
  const seconds = Math.max(5, Math.min(60, Number(data.seconds) || 10));
  draw(items[0]);
  if (items.length > 1) {
    timer = setInterval(() => {
      index = (index + 1) % items.length;
      draw(items[index]);
    }, seconds * 1000);
  }
}
async function startOverlay() {
  try {
    await signInAnonymously(auth);
    onValue(ref(db, "sponsorOverlay"), snapshot => cycle(snapshot.val()), error => {
      stage.classList.remove("show");
      console.error("Error leyendo sponsorOverlay:", error);
    });
  } catch (error) {
    stage.classList.remove("show");
    console.error("No se pudo conectar a Firebase:", error);
  }
}
startOverlay();
</script>
