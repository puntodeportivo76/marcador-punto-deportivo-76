.board::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.025);pointer-events:none}
.live{position:relative;z-index:2;background:var(--orange);color:#071827;text-align:center;font-size:clamp(13px,2.15vw,23px);font-weight:1000;letter-spacing:.7px;padding:8px 12px}
.main{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);gap:12px;align-items:center;padding:13px 18px 17px;height:calc(100% - 48px)}
.team{text-align:center;min-width:0}
.teamName{background:rgba(4,19,37,.94);border:3px solid var(--orange);border-radius:13px;padding:7px 8px;font-size:clamp(18px,3vw,32px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 3px #000}
.away .teamName{border-color:var(--orange)}
.score{font-size:clamp(62px,10vw,112px);line-height:.86;font-weight:1000;color:var(--orange);margin-top:16px;text-shadow:0 4px 10px #000,0 0 10px rgba(255,101,0,.5)}
.away .score{color:#ff6500}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.period{background:rgba(5,16,29,.94);border:2px solid #555;border-radius:9px;padding:4px 16px;font-size:clamp(16px,2.5vw,25px);font-weight:1000}

.head{background:var(--orange);color:#061522;border-radius:10px;text-align:center;font-weight:1000;padding:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.panel{border:2px solid var(--orange);border-radius:13px;background:rgba(3,14,27,.92);padding:9px}
.panel.away{border-color:var(--blue)}
.panel h3{margin:0 0 4px;text-align:center;font-size:18px}
.n{text-align:center;font-weight:1000;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn,.action{border:2px solid var(--orange);border-radius:9px;background:#071a2e;color:#fff;font-weight:1000;padding:9px 3px}
.panel.away .btn{border-color:var(--blue)}
.btn.minus{background:#641c1c;border-color:#ff6a5d!important}
.action{width:100%}
.box{display:none;margin-top:7px;padding:9px;border:2px solid var(--orange);border-radius:11px;background:#000d}
.box.show{display:block}
.box label{display:block;font-weight:900;margin:5px 0 3px}
.box input,.time input{width:100%;padding:8px;border-radius:8px;border:2px solid #647180;background:#fff;color:#111;font-weight:800}
.time{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.footer{text-align:center;font-size:10px;letter-spacing:2px;opacity:.75;margin-top:8px}
.teamLogo{width:42px;height:42px;object-fit:contain;border-radius:8px;margin:0 auto 3px;display:none;background:#fff8;padding:2px}.teamLogo.show{display:block}.teamStats{display:flex;justify-content:center;gap:8px;font-size:11px;font-weight:900;margin-top:2px}.teamStats span{white-space:nowrap}.posDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#647180;margin-left:2px;vertical-align:middle}.posDot.on{background:var(--orange);box-shadow:0 0 7px var(--orange)}.away .posDot.on{background:var(--blue);box-shadow:0 0 7px var(--blue)}
.logoBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.logoBox input{width:100%;font-size:12px}.logoBtn{padding:7px;border:2px solid var(--orange);border-radius:8px;background:#071a2e;color:#fff;font-weight:900;width:100%}.panel.away .logoBtn{border-color:var(--blue)}

/* P76 marcador compacto horizontal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);align-items:center;gap:8px;padding:7px 10px;height:100%}
.teamCard{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px}
.teamTop{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:0;align-items:stretch}
.teamName{height:30px;min-width:0;padding:4px 8px;border:2px solid var(--orange);border-right:0;border-radius:8px 0 0 8px;background:rgba(4,17,31,.92);font-size:13px;font-weight:1000;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamColorBox{width:34px;height:30px;border:2px solid var(--orange);border-radius:0 8px 8px 0;background:var(--orange);box-shadow:inset 0 0 0 2px #0004}
.awayCard .teamName,.awayCard .teamColorBox{border-color:var(--blue)}
.teamBody{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px}
.teamBody .score{font-size:42px;line-height:.9;margin:0;font-weight:1000}
.teamStats{display:flex;justify-content:center;gap:8px;font-size:10px;font-weight:900;margin-top:0}.teamStats span{white-space:nowrap}
.teamLogo{width:34px;height:34px;object-fit:contain;border-radius:6px;margin:0;display:none;background:#fff8;padding:2px}.teamLogo.show{display:block}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.centerLabel{font-size:8px;letter-spacing:1px;font-weight:1000;opacity:.75}.period{font-size:12px;padding:2px 7px;border:2px solid var(--orange);border-radius:7px;margin:0;font-weight:1000}.clock{display:block;font-size:25px;font-weight:1000;letter-spacing:1px;line-height:1}
.colorBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.colorBox>div{display:grid;grid-template-columns:1fr 48px;gap:6px;align-items:center}.colorBox label{font-size:11px;font-weight:900}.colorBox input{width:48px;height:32px;padding:2px;border:2px solid var(--orange);border-radius:7px;background:#071a2e}
@media(max-width:560px){
 #scoreboard{padding:3px}
 .board{border-radius:10px;border-width:2px;aspect-ratio:1200/220}
 .main{grid-template-columns:minmax(0,1fr) 68px minmax(0,1fr);gap:4px;padding:4px 5px}
 .teamTop{grid-template-columns:minmax(0,1fr) 25px}.teamName{height:24px;font-size:10px;padding:3px 4px;border-width:1px}.teamColorBox{width:25px;height:24px;border-width:1px}
 .teamBody{min-height:37px;gap:4px}.teamBody .score{font-size:31px}.teamLogo{width:25px;height:25px}
 .teamStats{font-size:8px;gap:4px}.posDot{width:6px;height:6px}
 .centerLabel{font-size:7px}.period{font-size:10px;padding:2px 4px;border-width:1px}.clock{font-size:20px}
}

/* P76 layout compacto solicitado: color | equipo | marcador | tiempo+periodo | marcador | equipo | color */
.main{grid-template-columns:minmax(0,1fr) 175px minmax(0,1fr);gap:10px;padding:7px 10px;height:100%;}
.teamCard{justify-content:center;gap:2px;}
.teamTop{display:grid;align-items:stretch;gap:0;}
.homeTop{grid-template-columns:38px minmax(0,1fr);}
.awayTop{grid-template-columns:72px minmax(0,1fr) 38px;}
.homeTop .teamColorBox{border-radius:8px 0 0 8px;border-right:0;}
.homeTop .teamName{border-radius:0 8px 8px 0;border-left:0;}
.awayTop .teamColorBox{border-radius:0 8px 8px 0;border-left:0;}
.awayTop .teamName{border-radius:0;border-left:0;border-right:0;}
.teamColorBox{width:auto;height:36px;min-height:36px;}
.teamName{height:36px;font-size:14px;padding:4px 7px;}
.teamBody{min-height:0;height:58px;display:flex;align-items:center;justify-content:center;}
.homeBody{justify-content:flex-end;}
.awayBody{display:none;}
.scoreBox{height:58px;min-width:72px;padding:0 12px;border:2px solid var(--orange);border-radius:9px;background:rgba(4,17,31,.94);display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
.scoreBox .score{font-size:44px;line-height:1;margin:0;color:#fff;text-shadow:0 3px 7px #000;}
.awayTop .scoreMini{height:58px;min-width:72px;padding:0 12px;border:2px solid var(--blue);border-radius:9px;background:rgba(4,17,31,.94);display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-size:44px;line-height:1;color:#fff;margin:0;}
.teamLogo{width:30px;height:30px;}
.teamStats{font-size:9px;gap:7px;}
.center{gap:2px;}
.timeLine{display:flex;align-items:center;justify-content:center;gap:6px;}
.clock{width:auto;min-width:102px;font-size:28px;padding:5px 8px;border-width:3px;border-radius:10px;}
.period{font-size:13px;padding:5px 7px;border-radius:7px;white-space:nowrap;}
@media(max-width:560px){
 .main{grid-template-columns:minmax(0,1fr) 125px minmax(0,1fr);gap:5px;padding:5px 6px;}
 .homeTop{grid-template-columns:28px minmax(0,1fr);}
 .awayTop{grid-template-columns:58px minmax(0,1fr) 28px;}
 .teamColorBox,.teamName{height:28px;min-height:28px;}
 .teamName{font-size:11px;padding:3px 5px;}
 .teamBody{height:48px;}
 .scoreBox{height:48px;min-width:58px;padding:0 7px;}
 .scoreBox .score,.awayTop .scoreMini{font-size:34px;}
 .awayTop .scoreMini{height:48px;min-width:58px;padding:0 7px;}
 .clock{min-width:72px;font-size:21px;padding:4px 5px;}
 .period{font-size:10px;padding:4px 5px;}
 .teamStats{font-size:8px;gap:4px;}
}

/* ===== Marcador estilo TV / referencia YouTube ===== */
.tvScoreboard{display:grid;grid-template-columns:34px minmax(120px,1fr) 82px 150px 82px minmax(120px,1fr) 34px;align-items:stretch;gap:0;height:100%;padding:7px 10px;}
.tvColor{height:100%;min-height:58px;background:var(--orange);border:2px solid rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px #0005,0 0 10px #0008;}
.tvColorHome{border-radius:8px 0 0 8px;border-right:0;}
.tvColorAway{background:var(--blue);border-radius:0 8px 8px 0;border-left:0;}
.tvTeam{min-width:0;display:flex;align-items:center;gap:7px;padding:5px 10px;background:linear-gradient(180deg,#16283a,#071522);border-top:2px solid var(--orange);border-bottom:2px solid var(--orange);box-shadow:inset 0 1px #ffffff20;}
.tvHomeTeam{border-left:0;}
.tvAwayTeam{border-top-color:var(--blue);border-bottom-color:var(--blue);}
.tvTeamText{min-width:0;flex:1;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.tvName{font-size:clamp(15px,2.3vw,25px);font-weight:1000;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 3px #000;}
.tvStats{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:3px;padding-top:3px;border-top:1px solid #ffffff35;font-size:10px;font-weight:1000;opacity:1;width:100%;}
.tvStats .foulsWrap{display:inline-flex;align-items:center;justify-content:flex-end;gap:5px;min-width:0;}
.tvStats .foulsLabel{font-size:10px;letter-spacing:.4px;color:#fff;white-space:nowrap;}
.tvStats .foulsBox{display:inline-flex;align-items:center;justify-content:center;width:22px;height:17px;padding:0;border:1px solid #fff;border-radius:3px;background:#fff;color:#e01818;font-size:11px;font-weight:1000;line-height:1;box-shadow:0 1px 2px #0008;}


.tvLogo{width:34px;height:34px;object-fit:contain;border-radius:5px;background:#fff;padding:2px;display:none;flex:none;}
.tvLogo.show{display:block;}
.tvScore{height:100%;min-height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#101e2b,#020b13);border:2px solid var(--orange);box-shadow:inset 0 0 10px #000,0 0 7px #0008;}
.tvAwayScore{border-color:var(--blue);}

.tvCenter{min-width:0;background:linear-gradient(180deg,#263444,#08131f);border-top:2px solid #777;border-bottom:2px solid #777;border-left:2px solid #555;border-right:2px solid #555;position:relative;}

<script id="p76-control-remoto-reordenado-js">
(function(){
  const $ = (s) => document.querySelector(s);
  const panel = () => $('#controlPanel') || document.querySelector('.controlPanel') || document.querySelector('main');

  function txt(el){ return (el?.textContent || '').replace(/\s+/g,' ').trim(); }

  function findText(text){
    return [...document.querySelectorAll('button,label,h2,h3,h4,h5,legend,div,span')]
      .find(el => el.children.length===0 && txt(el).toLowerCase()===text.toLowerCase());
  }

  function closestRow(el){
    return el?.closest('.row,.controlRow,.field,.control-group,.group,.section,.card,.panel,section,div');
  }

  function moveNamesFirst(){
    const p=panel();
    if(!p) return;
    const candidates=[...p.querySelectorAll('h2,h3,h4,h5,fieldset,.teamNames,.names')];
    const names=candidates.find(el=>{
      const t=txt(el).toLowerCase();
      return t.includes('nombres de equipos') || t==='nombres' || t.includes('nombre de equipo');
    });
    if(names) p.prepend(names);
  }

  function removeDuplicatePointNames(){
    const p=panel();
    if(!p) return;
    // Within each score-control group, keep the first team-name heading/label.
    const groups=[...p.querySelectorAll('.scoreControls,.points,.scoreRow,.teamControls,.controlRow')];
    groups.forEach(g=>{
      const seen=new Set();
      [...g.querySelectorAll('h2,h3,h4,h5,label,span,div')].forEach(el=>{
        if(el.children.length) return;
        const t=txt(el).toLowerCase();
        if(t && (t==='local'||t==='visita')){
          if(seen.has(t)) el.remove();
          else seen.add(t);
        }
      });
    });
  }

  function colorResets(){
    const p=panel();
    if(!p) return;
    [...p.querySelectorAll('button')].forEach(b=>{
      const t=txt(b).toLowerCase();
      if(t.includes('reiniciar reloj')){
        b.style.background='#6b4f00';
        b.style.borderColor='#ffb300';
        b.style.color='#fff';
      }
      if(t.includes('reiniciar partido') || t.includes('reiniciar partidos')){
        b.style.background='#6b2020';
        b.style.borderColor='#ff5a5a';
        b.style.color='#fff';
      }
    });
  }

  function compactClock(){
    const p=panel();
    if(!p) return;
    const labels=[...p.querySelectorAll('label,h2,h3,h4,h5,legend,span,div')];
    const clockLabel=labels.find(e=>e.children.length===0 && /^(reloj|tiempo)$/i.test(txt(e)));
    const row=closestRow(clockLabel);
    if(!row) return;

    row.style.display='flex';
    row.style.flexWrap='nowrap';
    row.style.alignItems='center';
    row.style.gap='6px';
    row.style.whiteSpace='nowrap';

    const controls=[...row.querySelectorAll('input,button,select')];
    const timeInput=controls.find(e=>e.matches('input[type="number"],input[type="text"]'));
    if(timeInput){
      timeInput.style.width='74px';
      timeInput.style.minWidth='74px';
      timeInput.style.maxWidth='74px';
      timeInput.style.textAlign='center';
    }

    const buttons=[...row.querySelectorAll('button')];
    const play=buttons.find(b=>/^(iniciar|pausar|reanudar|reloj|play)/i.test(txt(b)) || /▶|⏯/.test(txt(b)));
    if(play){
      play.textContent='▶';
      play.title='Iniciar reloj';
      play.style.minWidth='42px';
    }
    const apply=buttons.find(b=>/aplicar tiempo|aplicar/i.test(txt(b)));
    if(apply){
      apply.textContent='Aplicar tiempo';
      apply.style.minWidth='100px';
    }
  }

  function run(){
    moveNamesFirst();
    removeDuplicatePointNames();
    colorResets();
    compactClock();
  }

  document.addEventListener('DOMContentLoaded',run);
  setTimeout(run,100);
  setTimeout(run,500);
  setTimeout(run,1200);
})();
</script>
