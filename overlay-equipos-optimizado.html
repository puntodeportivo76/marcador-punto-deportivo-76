 return [team.logo,team.logoUrl,team.escudo].find(v=>typeof v==='string'&&v.trim())||'';
}
function text(id,value){const el=elements[id];value=String(value);if(el.textContent!==value)el.textContent=value;}
function hidden(el,value){if(el.hidden!==value)el.hidden=value;}
function render(){
 if(intro.visible!==true){stage.classList.remove('show');return;}
 const title=clean(intro.eventName);
 text('eventTitle',title);hidden(elements.eventTitle,!title);
 text('division',intro.division||'U13');
 text('gender',clean(intro.category||'Femenina').toLowerCase()==='masculina'?'MASCULINA':'FEMENINA');
 for(const side of ['home','away']){
  const name=clean(intro[side+'Name']||score[side+'Name'])||(side==='home'?'EQUIPO LOCAL':'EQUIPO VISITANTE');
  text(side+'Name',name);
  const img=elements[side+'Logo'],url=logoFor(side,name);
  if(url){if(img.getAttribute('src')!==url)img.src=url;hidden(img,false);}
  else{if(img.hasAttribute('src'))img.removeAttribute('src');hidden(img,true);}
 }
 if(!stage.classList.contains('show'))stage.classList.add('show');
}
function updateScore(next){
 const fields=['homeName','awayName','homeLogo','awayLogo'];
 const changed=fields.some(k=>score[k]!==next[k]);
 score=Object.fromEntries(fields.map(k=>[k,next[k]]));
 if(changed&&intro.visible===true)render();
}
// Modo demostración: ?demo=1. No lee ni modifica datos reales.
if(new URLSearchParams(location.search).get('demo')==='1'){
 intro={visible:true,eventName:'PUNTO DEPORTIVO 76',division:'U13',category:'Femenina',homeName:'RDS',awayName:'INTER'};
 render();
}else{
 (async()=>{try{
  await signInAnonymously(auth);
  onValue(ref(db,'teamIntroOverlay'),s=>{intro=s.val()||{};render()},e=>{intro={};stage.classList.remove('show');console.error('Presentación',e)});
  onValue(ref(db,'marcador'),s=>{updateScore(s.val()||{})},e=>console.error('Marcador',e));
  onValue(ref(db,'p76Equipos/catalogo'),s=>{catalog=s.val()||{};if(intro.visible===true)render()},e=>console.error('Catálogo',e));
 }catch(e){stage.classList.remove('show');console.error('No se pudo conectar a Firebase',e)}})();
}
</script>
</body>
