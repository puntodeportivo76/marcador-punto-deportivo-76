.board::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.025);pointer-events:none}
.live{position:relative;z-index:2;background:var(--orange);color:#071827;text-align:center;font-size:clamp(13px,2.15vw,23px);font-weight:1000;letter-spacing:.7px;padding:8px 12px}
.main{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);gap:12px;align-items:center;padding:13px 18px 17px;height:calc(100% - 48px)}
.team{text-align:center;min-width:0}
.teamName{background:rgba(4,19,37,.94);border:3px solid var(--orange);border-radius:13px;padding:7px 8px;font-size:clamp(18px,3vw,32px);font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 3px #000}
.away .teamName{border-color:var(--orange)}
.score{font-size:clamp(62px,10vw,112px);line-height:.86;font-weight:1000;color:var(--orange);margin-top:16px;text-shadow:0 4px 10px #000,0 0 10px rgba(255,101,0,.5)}
.away .score{color:#ff6500}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.period{background:rgba(5,16,29,.94);border:2px solid #555;border-radius:9px;padding:4px 16px;font-size:clamp(16px,2.5vw,25px);font-weight:1000}

.head{background:var(--orange);color:#061522;border-radius:10px;text-align:center;font-weight:1000;padding:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.panel{border:2px solid var(--orange);border-radius:13px;background:rgba(3,14,27,.92);padding:9px}
.panel.away{border-color:var(--blue)}
.panel h3{margin:0 0 4px;text-align:center;font-size:18px}
.n{text-align:center;font-weight:1000;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn,.action{border:2px solid var(--orange);border-radius:9px;background:#071a2e;color:#fff;font-weight:1000;padding:9px 3px}
.panel.away .btn{border-color:var(--blue)}
.btn.minus{background:#641c1c;border-color:#ff6a5d!important}
.action{width:100%}
.box{display:none;margin-top:7px;padding:9px;border:2px solid var(--orange);border-radius:11px;background:#000d}
.box.show{display:block}
.box label{display:block;font-weight:900;margin:5px 0 3px}
.box input,.time input{width:100%;padding:8px;border-radius:8px;border:2px solid #647180;background:#fff;color:#111;font-weight:800}
.time{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.footer{text-align:center;font-size:10px;letter-spacing:2px;opacity:.75;margin-top:8px}
@media(max-width:560px){
 #scoreboard{padding:4px}
 .board{border-radius:15px;border-width:2px;aspect-ratio:1200/380}
 .live{display:none}
 .main{grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:4px;padding:5px 6px 6px;height:100%}
 .teamName{font-size:12px;padding:4px 3px;border-width:1px;min-height:27px;display:flex;align-items:center;justify-content:center}
 .score{font-size:40px;margin-top:2px;line-height:1}
 .period{font-size:13px;padding:4px 3px;border-width:2px;margin:auto}
 .clock,.brand{display:none}
 .btn{font-size:14px;padding:8px 2px}
}

/* MENÚ REORDENADO PUNTO DEPORTIVO 76 */
.menu-section{margin-top:10px;padding:10px;border:1px solid rgba(255,102,0,.35);border-radius:12px;background:rgba(0,0,0,.12)}
.section-title{font-weight:900;font-size:14px;letter-spacing:.5px;margin-bottom:8px;color:#ff6b00}
.grid.two{grid-template-columns:1fr 1fr;gap:8px}
.panel{min-width:0}
.panel h3{margin:0 0 5px;font-size:12px}
.n{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full{width:100%;margin-top:7px}
.score-row{display:grid;grid-template-columns:1fr repeat(4,auto);gap:6px;align-items:center;margin:6px 0}
.score-row>span{font-weight:800;font-size:14px}
.score-row .btn{min-width:48px;padding:9px 8px}
.time{display:grid;grid-template-columns:1fr 1.35fr;gap:7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.action,.btn{font-weight:800}
.danger{border-color:#ff6b00}
@media(max-width:430px){
  .score-row{grid-template-columns:1fr repeat(4,1fr)}
  .score-row .btn{min-width:0;padding:9px 4px}
  .actions{grid-template-columns:1fr 1fr}
}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyBC5Z1q3U6lweV3NLq9zFpoDcyv27Ecg4",authDomain:"puntodeportivo-76.firebaseapp.com",databaseURL:"https://puntodeportivo-76-default-rtdb.firebaseio.com",projectId:"puntodeportivo-76",storageBucket:"puntodeportivo-76.firebasestorage.app",messagingSenderId:"881911537312",appId:"1:881911537312:web:9a5fb8f21ca43887c2f3c5"});
const db=getDatabase(app),gameRef=ref(db,"marcador"),control=new URLSearchParams(location.search).get("control")==="1";
document.getElementById("controls").style.display=control?"block":"none";
let state={homeName:"LOCAL",awayName:"VISITA",homeScore:0,awayScore:0,q:1,clockSeconds:600,clockRunning:false,clockEndAt:null},editH=false,editA=false;
const $=id=>document.getElementById(id);
function draw(){
 $("homeName").textContent=state.homeName||"LOCAL";$("awayName").textContent=state.awayName||"VISITA";
 $("homeScore").textContent=Math.max(0,state.homeScore||0);$("awayScore").textContent=Math.max(0,state.awayScore||0);
 $("period").textContent=(["1Q","2Q","3Q","4Q","OT"][(state.q||1)-1]||"1Q");
 if(control){if(!editH)$("hi").value=state.homeName||"LOCAL";if(!editA)$("ai").value=state.awayName||"VISITA";$("hcn").textContent=state.homeName||"LOCAL";$("acn").textContent=state.awayName||"VISITA"}
}
async function save(x){state=x;draw();await set(gameRef,state)}
onValue(gameRef,s=>{if(s.exists()){state={...state,...s.val()};draw()}else if(control){set(gameRef,state).then(draw)}else{draw()}});
if(control){
 $("hi").oninput=()=>editH=true;$("ai").oninput=()=>editA=true;
 $("hm").onclick=()=>save({...state,homeScore:Math.max(0,(state.homeScore||0)-1)});$("h1").onclick=()=>save({...state,homeScore:(state.homeScore||0)+1});$("h2").onclick=()=>save({...state,homeScore:(state.homeScore||0)+2});$("h3").onclick=()=>save({...state,homeScore:(state.homeScore||0)+3});
 $("am").onclick=()=>save({...state,awayScore:Math.max(0,(state.awayScore||0)-1)});$("a1").onclick=()=>save({...state,awayScore:(state.awayScore||0)+1});$("a2").onclick=()=>save({...state,awayScore:(state.awayScore||0)+2});$("a3").onclick=()=>save({...state,awayScore:(state.awayScore||0)+3});
 $("nb").onclick=()=>$("box").classList.toggle("show");$("sn").onclick=()=>{editH=editA=false;save({...state,homeName:$("hi").value.trim()||"LOCAL",awayName:$("ai").value.trim()||"VISITA"});$("box").classList.remove("show")};
 $("pb").onclick=()=>save({...state,q:(state.q||1)<5?(state.q||1)+1:1});
 $("ra").onclick=()=>{editH=editA=false;save({homeName:"LOCAL",awayName:"VISITA",homeScore:0,awayScore:0,q:1,clockSeconds:600,clockRunning:false,clockEndAt:null})};
}
draw();
</script>
